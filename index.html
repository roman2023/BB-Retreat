<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Brien Retreat — Case 1: Malignant Hematology</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#fafaf9;--t:#1c1c1a;--t2:#6b6b66;--t3:#9c9a92;--bd:#e5e5e2;--bd2:#d4d4cf;--info:#1570b8;--infobg:#e6f1fb;--danger:#a32d2d;--dangerbg:#fcebeb;--warn:#854f0b;--warnbg:#faeeda;--teal:#0f6e56;--tealbg:#e1f5ee;--purple:#534ab7;--purplebg:#eeedfe;--coral:#993c1d;--coralbg:#faece7;--r:8px;--rl:12px;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--fm:"SF Mono",Menlo,Consolas,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#2c2c2a;--bg3:#222220;--t:#e8e6dd;--t2:#9c9a92;--t3:#6b6b66;--bd:#3d3d3a;--bd2:#52524e;--infobg:#0c2d4a;--dangerbg:#3a1515;--warnbg:#2e1e08;--tealbg:#042e24;--purplebg:#1e1a3e;--coralbg:#2e1508}}
body{font-family:var(--f);background:var(--bg3);color:var(--t);line-height:1.6;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:16px 20px}
.nav{display:flex;gap:3px;padding:8px 0 16px;border-bottom:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav button{padding:5px 9px;font-size:11px;border:none;border-radius:var(--r);cursor:pointer;white-space:nowrap;font-family:var(--f);transition:all .15s}
.nav button.active{background:var(--infobg);color:var(--info);font-weight:600}
.nav button.done{background:transparent;color:var(--t2)}
.nav button.future{background:transparent;color:var(--t3);opacity:.5}
.content{padding:24px 0}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);padding:20px;margin-bottom:16px}
.card.ac-teal{border:2px solid var(--teal)}
.card.ac-info{border:2px solid var(--info)}
.card.ac-danger{border:2px solid var(--danger)}
.card.ac-warn{border:2px solid var(--warn)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r);letter-spacing:.04em;text-transform:uppercase}
.badge-info{background:var(--infobg);color:var(--info)}
.badge-danger{background:var(--dangerbg);color:var(--danger)}
.badge-warn{background:var(--warnbg);color:var(--warn)}
.badge-teal{background:var(--tealbg);color:var(--teal)}
.badge-purple{background:var(--purplebg);color:var(--purple)}
h2{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:var(--t2);margin-bottom:16px}
.prompt{background:var(--bg2);border-left:3px solid var(--teal);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;margin-bottom:12px;font-size:14px}
.prompt .q{font-weight:600;color:var(--t)}
.prompt .time{font-size:12px;color:var(--t3);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.finding{padding:10px 12px;background:var(--bg2);border-radius:var(--r);font-size:13px}
.finding.flag{background:var(--warnbg)}
.finding .lb{font-weight:600;margin-bottom:2px}
.finding .vl{color:var(--t2)}
img.case-img{width:100%;border-radius:var(--r);margin:8px 0;cursor:pointer;transition:transform .2s}
img.case-img:active{transform:scale(1.5);z-index:10;position:relative}
.img-caption{font-size:12px;color:var(--t3);text-align:center;margin:-4px 0 12px}
.menti-card{background:linear-gradient(135deg,#5d3fd3 0%,#7c5ce7 100%);color:#fff;border-radius:var(--rl);padding:20px;margin:16px 0;text-align:center}
.menti-card h3{font-size:18px;font-weight:600;margin-bottom:8px}
.menti-card .code{font-size:36px;font-weight:700;letter-spacing:.15em;margin:8px 0}
.menti-card .url{font-size:14px;opacity:.85;margin-bottom:4px}
.menti-card .desc{font-size:13px;opacity:.7}
.mt-table{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.mt-hdr{display:grid;grid-template-columns:70px 1fr 1fr 65px 55px;gap:8px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--t3);background:var(--bg2);text-transform:uppercase;letter-spacing:.04em}
.mt-row{display:grid;grid-template-columns:70px 1fr 1fr 65px 55px;gap:8px;padding:8px 12px;font-size:13px;border-top:1px solid var(--bd);align-items:center}
.mt-row .gene{font-weight:600}
.mt-row .cod{font-family:var(--fm);font-size:12px;color:var(--t2)}
.mt-row .prot{font-family:var(--fm);font-size:12px}
.mt-row .vaf{font-weight:600;color:var(--warn)}
.db-card{cursor:pointer;transition:transform .1s}
.db-card:hover{transform:translateY(-1px)}
.slider-group{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider-group label{font-size:13px;color:var(--t2);min-width:130px}
.slider-group input[type=range]{flex:1;accent-color:var(--teal)}
.slider-group .val{font-size:14px;font-weight:600;min-width:48px;text-align:right}
.metric{background:var(--bg2);border-radius:var(--r);padding:12px;text-align:center}
.metric .lb{font-size:12px;color:var(--t2)}
.metric .num{font-size:24px;font-weight:600;margin-top:2px}
.timeline{padding-left:24px;position:relative}
.timeline::before{content:'';position:absolute;left:10px;top:14px;bottom:14px;width:2px;background:var(--bd);border-radius:1px}
.timeline .tp{display:flex;gap:16px;margin-bottom:18px;position:relative}
.timeline .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:3px;position:relative;z-index:1}
.timeline .dot.empty{background:var(--bg2);border:2px solid var(--bd2)}
.timeline .dot.warn{background:var(--warnbg);border:2px solid var(--coral)}
.spectrum-bar{display:flex;height:40px;border-radius:var(--r);overflow:hidden;margin-bottom:8px;position:relative}
.spectrum-bar .zone{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.spectrum-bar .marker{position:absolute;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--t);transition:left .3s}
.cr-row{padding:8px 10px;margin-bottom:4px;border-radius:var(--r);background:var(--bg2);font-size:13px;line-height:1.5;transition:background .2s}
.cr-row:hover{background:var(--infobg)}
.cr-row .tl{font-weight:600}
.cr-row .dt{color:var(--t2);font-size:12px}
.cr-row .nt{color:var(--t3);font-size:11px;font-style:italic;margin-top:2px}
.footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-top:24px;border-top:1px solid var(--bd)}
.footer .ctr{font-size:12px;color:var(--t3)}
.btn{padding:8px 22px;font-size:14px;border-radius:var(--r);cursor:pointer;font-family:var(--f);transition:all .15s}
.btn-o{border:1px solid var(--bd2);background:transparent;color:var(--t)}
.btn-o:hover{background:var(--bg2)}
.btn-o:disabled{opacity:.3;cursor:not-allowed}
.btn-p{border:none;background:var(--info);color:#fff;font-weight:600}
.btn-p:hover{opacity:.9}
.btn-p:disabled{background:var(--bd);color:var(--t3);cursor:not-allowed}
.btn-reveal{padding:14px 32px;font-size:17px;font-weight:600;background:linear-gradient(135deg,#1570b8,#0f6e56);color:#fff;border:none;border-radius:var(--r);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-reveal:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.ihc-card{padding:10px 12px;background:var(--bg2);border-radius:var(--r);margin-bottom:8px}
.ihc-card .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.ihc-card .var{font-weight:600;font-size:13px;font-family:var(--fm)}
.cbc-grid{display:grid;grid-template-columns:1fr repeat(2,120px);gap:0;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;font-size:13px}
.cbc-grid .hdr{background:var(--bg2);padding:6px 10px;font-weight:600;border-bottom:1px solid var(--bd)}
.cbc-grid .cell{padding:6px 10px;border-bottom:1px solid var(--bd);border-left:1px solid var(--bd)}
.cbc-grid .cell.danger{color:var(--danger);font-weight:600}
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px}
.lightbox img{max-width:95%;max-height:95%;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
@media(max-width:600px){
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .mt-hdr,.mt-row{grid-template-columns:60px 1fr 1fr 55px 45px;font-size:11px}
  .cbc-grid{grid-template-columns:1fr repeat(2,90px);font-size:12px}
  .nav button{font-size:10px;padding:4px 6px}
  h2{font-size:18px}
}
.vaf-scenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:12px}
.vaf-sc{padding:8px;border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;font-size:12px;line-height:1.4;background:var(--bg);transition:all .15s}
.vaf-sc:hover{border-color:var(--bd2);background:var(--bg2)}
.vaf-sc.active{border:2px solid var(--info);background:var(--infobg)}
.vaf-sc .sn{font-weight:600;font-size:12px;margin-bottom:1px}
.vaf-sc .sd{color:var(--t2);font-size:11px}
.vaf-formula{background:var(--bg2);border-radius:var(--rl);padding:12px 16px;margin-bottom:12px;font-family:var(--fm);font-size:13px;line-height:2}
.vaf-formula .hl{background:var(--infobg);color:var(--info);padding:1px 5px;border-radius:4px;font-weight:600}
.vaf-formula .hw{background:var(--warnbg);color:var(--warn);padding:1px 5px;border-radius:4px;font-weight:600}
.vaf-formula .hd{background:var(--dangerbg);color:var(--danger);padding:1px 5px;border-radius:4px;font-weight:600}
.vaf-results{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.vaf-metric{background:var(--bg2);border-radius:var(--r);padding:10px;text-align:center}
.vaf-metric .vml{font-size:11px;color:var(--t2)}
.vaf-metric .vmn{font-size:22px;font-weight:600;margin-top:2px}
.chr-vis{display:flex;gap:20px;justify-content:center;margin-bottom:12px}
.chr-pair{text-align:center}
.chr-pair .cl{font-size:11px;color:var(--t3);margin-bottom:4px}
.chr-bars{display:flex;gap:3px;justify-content:center}
.chr-b{width:16px;height:64px;border-radius:8px;border:1.5px solid var(--bd2)}
.chr-b.wt{background:var(--bg2)}
.chr-b.mut{background:#7F77DD}
.chr-b.del{background:transparent;border-style:dashed;border-color:var(--bd);opacity:.4}
.chr-b.dup{background:#AFA9EC;border-color:#7F77DD}
.chr-pair .cc{font-size:11px;color:var(--t2);margin-top:3px}
.vaf-rev{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px}
.vaf-rev .vrt{font-size:14px;font-weight:600;margin-bottom:10px}
.case-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.case-btn{padding:5px 12px;border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;font-size:11px;font-family:var(--fm);background:var(--bg);color:var(--t);transition:all .15s}
.case-btn:hover{background:var(--bg2);border-color:var(--bd2)}
.vaf-note{font-size:12px;color:var(--t3);line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="lb" style="display:none" class="lightbox" onclick="this.style.display='none'"></div>

<script>
function showLB(src){
  const lb=document.getElementById('lb');
  lb.innerHTML='<img src="'+src+'">';
  lb.style.display='flex';
}

const STAGES=[
{id:"s1",label:"Clinical",icon:"\u2460"},
{id:"s2",label:"Blood smear",icon:"\u2461"},
{id:"s3",label:"Bone marrow",icon:"\u2462"},
{id:"s4",label:"Dry tap",icon:"\u2463"},
{id:"s5",label:"NGS results",icon:"\u2464"},
{id:"s6",label:"Database tasks",icon:"\u2465"},
{id:"s7",label:"P53 IHC",icon:"\u2466"},
{id:"s8",label:"AS-PCR + Consensus",icon:"\u2467"},
{id:"s9",label:"JAK2 twist",icon:"\u2468"},
{id:"s10",label:"CH vs MPN",icon:"\u2469"}
];

let S={stage:0,revealJAK2:false,spectrumVAF:2};

function render(){
const s=STAGES[S.stage];
let nav=STAGES.map((st,i)=>{
let cls=i===S.stage?'active':i<S.stage?'done':'future';
return '<button class="'+cls+'" onclick="go('+i+')">'+st.icon+' '+st.label+'</button>';
}).join('');

let c='';
switch(s.id){
case 's1':c=sec1();break;case 's2':c=sec2();break;case 's3':c=sec3();break;
case 's4':c=sec4();break;case 's5':c=sec5();break;case 's6':c=sec6();break;
case 's7':c=sec7();break;case 's8':c=sec8();break;case 's9':c=sec9();break;
case 's10':c=sec10();break;
}

let f='<div class="footer"><button class="btn btn-o" '+(S.stage===0?'disabled':'')+' onclick="prev()">\u2190 Previous</button><span class="ctr">'+(S.stage+1)+' / '+STAGES.length+'</span><button class="btn btn-p" '+(S.stage===STAGES.length-1?'disabled':'')+' onclick="next()">'+(S.stage===STAGES.length-1?'End':'Next \u2192')+'</button></div>';

document.getElementById('app').innerHTML='<div class="nav">'+nav+'</div><div class="content">'+c+'</div>'+f;
if(s.id==='s6'){initVafExplorer();}
}

function initVafExplorer(){
var sc=document.getElementById('vaf-sc-container');
if(!sc)return;
sc.innerHTML='';
VAF_SCENARIOS.forEach(function(s,i){
var d=document.createElement('div');
d.className='vaf-sc'+(i===vafSc?' active':'');
d.innerHTML='<div class="sn">'+s.name+'</div><div class="sd">'+s.desc+'</div>';
d.onclick=function(){vafSelectSc(i)};
sc.appendChild(d);
});
var cb=document.getElementById('vaf-case-btns');
if(cb){cb.innerHTML='';VAF_CASES.forEach(function(c,i){
var b=document.createElement('button');
b.className='case-btn';
b.textContent=c.label+' (VAF '+c.vaf+'%)';
b.onclick=function(){vafLoadCase(i)};
cb.appendChild(b);
});}
vafUpdate();
}

function go(i){S.stage=i;render();window.scrollTo(0,0)}
function next(){if(S.stage<STAGES.length-1){S.stage++;render();window.scrollTo(0,0)}}
function prev(){if(S.stage>0){S.stage--;render();window.scrollTo(0,0)}}
function revealJAK2(){S.revealJAK2=true;render()}
function updateSV(v){S.spectrumVAF=+v;document.getElementById('sv').textContent=v+'%';document.getElementById('sm').style.left=Math.min(95,Math.max(5,v*3))+'%'}

var VAF_SCENARIOS=[
{name:'Diploid heterozygous',desc:'Standard somatic SNV',ct:2,m:1,chr:['wt','mut']},
{name:'LOH by deletion',desc:'Lost wild-type allele',ct:1,m:1,chr:['del','mut']},
{name:'Copy-neutral LOH',desc:'UPD: duplicated mutant',ct:2,m:2,chr:['mut','dup']},
{name:'Gain of mutant',desc:'Trisomy, 2 mut + 1 WT',ct:3,m:2,chr:['wt','mut','dup']},
{name:'Gain of wild-type',desc:'Trisomy, 1 mut + 2 WT',ct:3,m:1,chr:['wt','wt','mut']},
{name:'Homozygous deletion',desc:'Both alleles lost',ct:0,m:0,chr:['del','del']},
{name:'Tetraploid het',desc:'4 copies, 1 mutant',ct:4,m:1,chr:['wt','wt','wt','mut']},
{name:'Biallelic (2 hits)',desc:'Two different mutations',ct:2,m:2,chr:['mut','dup']}
];
var VAF_CASES=[
{label:'TP53 splice c.673-2A>G',vaf:4.1,pur:80},
{label:'TP53 R175H',vaf:2.2,pur:80},
{label:'TP53 K132M',vaf:3.4,pur:80},
{label:'JAK2 V617F (Jan)',vaf:1,pur:80},
{label:'JAK2 V617F (Nov)',vaf:9,pur:80}
];
var vafSc=0;

function vafCalcExpected(p,ccf,ct,m){
if(ct===0)return 0;
var num=(p/100)*(ccf/100)*m;
var den=(p/100)*ct+(1-p/100)*2;
return den===0?0:(num/den)*100;
}
function vafCalcCCF(obsVaf,p,ct,m){
if(m===0)return null;
var den=(p/100)*ct+(1-p/100)*2;
return Math.min(((obsVaf/100)*den)/((p/100)*m)*100,999);
}
function vafSelectSc(i){
vafSc=i;
var s=VAF_SCENARIOS[i];
document.getElementById('vaf-ct').value=s.ct;
document.getElementById('vaf-m').value=s.m;
document.getElementById('vaf-m').max=Math.max(s.ct,0);
document.querySelectorAll('.vaf-sc').forEach(function(el,j){el.className='vaf-sc'+(j===i?' active':'')});
vafUpdate();
}
function vafLoadCase(i){
var c=VAF_CASES[i];
document.getElementById('vaf-pur').value=c.pur;
document.getElementById('vaf-obs').value=c.vaf;
vafSc=0;
document.getElementById('vaf-ct').value=2;
document.getElementById('vaf-m').value=1;
document.getElementById('vaf-m').max=2;
document.querySelectorAll('.vaf-sc').forEach(function(el,j){el.className='vaf-sc'+(j===0?' active':'')});
vafUpdate();
}
function vafUpdate(){
var p=+document.getElementById('vaf-pur').value;
var ccf=+document.getElementById('vaf-ccf').value;
var ct=+document.getElementById('vaf-ct').value;
var m=Math.min(+document.getElementById('vaf-m').value,ct);
document.getElementById('vaf-m').value=m;
document.getElementById('vaf-m').max=Math.max(ct,0);
document.getElementById('vaf-pur-v').textContent=p+'%';
document.getElementById('vaf-ccf-v').textContent=ccf+'%';
document.getElementById('vaf-ct-v').textContent=ct;
document.getElementById('vaf-m-v').textContent=m;
var vaf=vafCalcExpected(p,ccf,ct,m);
var pureVaf=ct>0?Math.round(m/ct*100):0;
document.getElementById('vaf-res').innerHTML='<div class="vaf-metric"><div class="vml">Expected VAF</div><div class="vmn" style="color:var(--info)">'+Math.round(vaf*10)/10+'%</div></div><div class="vaf-metric"><div class="vml">Mutant : total</div><div class="vmn">'+m+' : '+ct+'</div></div><div class="vaf-metric"><div class="vml">If 100% pure</div><div class="vmn">'+(ct>0?pureVaf+'%':'N/A')+'</div></div>';
document.getElementById('vaf-form').innerHTML='VAF = (<span class="hl">p</span> \u00d7 <span class="hw">CCF</span> \u00d7 <span class="hd">m</span>) \u00f7 (<span class="hl">p</span> \u00d7 Ct + (1\u2212<span class="hl">p</span>) \u00d7 2)<br>VAF = (<span class="hl">'+(p/100)+'</span> \u00d7 <span class="hw">'+(ccf/100)+'</span> \u00d7 <span class="hd">'+m+'</span>) \u00f7 (<span class="hl">'+(p/100)+'</span> \u00d7 '+ct+' + '+(1-p/100).toFixed(2)+' \u00d7 2)<br>VAF = <strong style="font-size:15px">'+Math.round(vaf*10)/10+'%</strong>';
var s=VAF_SCENARIOS[vafSc];
var ch='<div class="chr-pair"><div class="cl">Tumor cell</div><div class="chr-bars">';
s.chr.forEach(function(c){ch+='<div class="chr-b '+c+'"></div>'});
ch+='</div><div class="cc">'+ct+' copies, '+m+' mutant</div></div><div class="chr-pair"><div class="cl">Normal cell</div><div class="chr-bars"><div class="chr-b wt"></div><div class="chr-b wt"></div></div><div class="cc">2 copies, 0 mutant</div></div>';
document.getElementById('vaf-chr').innerHTML=ch;
vafReverse();
}
function vafReverse(){
var obs=+document.getElementById('vaf-obs').value;
var p=+document.getElementById('vaf-pur').value;
var ct=+document.getElementById('vaf-ct').value;
var m=Math.min(+document.getElementById('vaf-m').value,ct);
document.getElementById('vaf-obs-v').textContent=obs+'%';
var ccfE=vafCalcCCF(obs,p,ct,m);
var disp='N/A',note='';
if(ccfE===null||m===0){note='Cannot estimate with 0 mutant copies.';}
else if(ccfE>100){disp='>100%';note='CCF exceeds 100% \u2014 consider LOH, copy gain of mutant allele, or lower purity than estimated.';}
else{disp=Math.round(ccfE)+'%';note=ccfE>90?'Likely clonal (present in nearly all tumor cells).':ccfE>50?'Present in a major subclone.':'Subclonal \u2014 present in a minority of tumor cells.';}
document.getElementById('vaf-rev-res').innerHTML='<div class="vaf-metric"><div class="vml">Observed VAF</div><div class="vmn">'+obs+'%</div></div><div class="vaf-metric"><div class="vml">Estimated CCF</div><div class="vmn" style="color:var(--warn)">'+disp+'</div></div><div class="vaf-metric"><div class="vml">Allelic state</div><div class="vmn" style="font-size:13px">'+VAF_SCENARIOS[vafSc].name+'</div></div>';
document.getElementById('vaf-rev-note').textContent=note;
}

function img(name,caption){
return '<img class="case-img" src="images/'+name+'" alt="'+caption+'" onclick="showLB(this.src)" loading="lazy"><div class="img-caption">'+caption+' <span style="font-size:11px;color:var(--info)">(tap to zoom)</span></div>';

function menti(pollNum,question){
